<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 모음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: #888;
    }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 620px;
      gap: 16px;
    }

    .cell {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .cell:hover {
      border-color: rgba(0,0,0,0.28);
    }

    .preview {
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #f5f5f5;
    }

    .preview iframe {
      position: absolute;
      top: 0; left: 0;
      width: 600px; height: 500px;
      border: none;
      transform-origin: top left;
      transform: scale(0.49);
    }

    .label {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 0.5px solid rgba(0,0,0,0.08);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
    }

    .label span {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>p5.js 작품</h1>
    <p>20261719 이준영</p>
  </header>

  <main id="projects">
    <div class="cell">
      <div class="preview">
        <iframe src="sample1/index.html"></iframe>
      </div>
      <div class="label">
        <div class="dot"></div>
        <span>추상화</span>
      </div>
    </div>

    <div class="cell">
      <div class="preview">
        <iframe src="sample4/index.html"></iframe>
      </div>
      <div class="label">
        <div class="dot"></div>
        <span>추상화에 시간에 따른 움직임 부여</span>
      </div>
    </div>

    <div class="cell">
      <div class="preview">
        <iframe src="sample2/index.html"></iframe>
      </div>
      <div class="label">
        <div class="dot"></div>
        <span>캐리커쳐</span>
      </div>
    </div>

    <div class="cell">
      <div class="preview">
        <iframe src="sample3/index.html"></iframe>
      </div>
      <div class="label">
        <div class="dot"></div>
        <span>캐리커쳐에 행동에 따른 움직임 부여
            (a,s,d,f,space,click)
        </span>
      </div>
    </div>
  </main>

</body>
</html>
